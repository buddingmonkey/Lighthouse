org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

# The build directories are set in the build scripts; this is the one Gradle scratch
# directory that is not, so that android/ holds only sources.
org.gradle.projectcachedir=../build-android/gradle

android.useAndroidX=true
android.nonTransitiveRClass=true

# Must equal the SDL2 GIT_TAG in libultraship/cmake/dependencies/android.cmake.
sdl2Tag=release-2.32.10

# Override with -PapplicationId=... to sign under your own identifier.
applicationId=com.harbormasters.lighthouse
